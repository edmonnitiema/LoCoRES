<!DOCTYPE html>

<script>
/* LoCoRES - Pont d'enregistrement (APK Capacitor), défini ici une seule fois pour toute l'application.
   Les modules Compositions et Examens blancs (iframes) le reprennent via window.parent.Pont. */
(function(){
  if(window.Pont)return;
  function cap(){return window.Capacitor||null}
  function plug(n){
    var c=cap();if(!c)return null;
    try{if(c.Plugins&&c.Plugins[n])return c.Plugins[n]}catch(e){}
    try{if(typeof c.registerPlugin==='function')return c.registerPlugin(n)}catch(e){}
    return null;
  }
  function isNative(){
    var c=cap();if(!c)return false;
    try{if(typeof c.isNativePlatform==='function'&&c.isNativePlatform())return true}catch(e){}
    try{if(typeof c.getPlatform==='function'&&c.getPlatform()!=='web')return true}catch(e){}
    return !!window.androidBridge||/; wv\)/.test(navigator.userAgent||'');
  }
  function msg(e){return String((e&&e.message)||e)}
  function annule(m){return /cancel|dismiss|abort/i.test(m)}
  function delai(p,ms,nom){
    return new Promise(function(ok,ko){
      var t=setTimeout(function(){ko(new Error(nom+' : délai dépassé'))},ms);
      p.then(function(v){clearTimeout(t);ok(v)},function(e){clearTimeout(t);ko(e)});
    });
  }
  function init(){
    if(window.Pont||!isNative())return;
    window.Pont={
      enregistrer:async function(name,type,b64,dossier,titre){
        var FS=plug('Filesystem'),SH=plug('Share'),repli=null,etape='';
        try{
          if(!FS)throw new Error('plugin Filesystem introuvable dans l\u2019APK');
          if(dossier){
            /* 1) Dossier dans « Documents » (peut être refusé selon la version d'Android) */
            try{
              etape='permissions';
              try{var pm=await FS.checkPermissions();if(pm&&pm.publicStorage&&pm.publicStorage!=='granted')await FS.requestPermissions()}catch(e){}
              var rel=dossier+'/'+name;
              etape='écriture dans Documents';
              await delai(FS.writeFile({path:rel,data:b64,directory:'DOCUMENTS',recursive:true}),20000,'écriture dans Documents');
              etape='lecture du chemin';
              var g=await FS.getUri({path:rel,directory:'DOCUMENTS'});
              var ch=decodeURI(String(g.uri).replace(/^file:\/\//,''));
              return {chemin:ch,dossier:dossier,dossierChemin:ch.slice(0,ch.lastIndexOf('/')),uri:g.uri};
            }catch(e){repli=etape+' : '+msg(e)}
          }
          /* 2) Repli fiable : fichier temporaire + feuille de partage Android */
          if(!SH)throw new Error('plugin Share introuvable dans l\u2019APK');
          etape='écriture temporaire';
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          etape='partage';
          var titreP=titre||'Enregistrer ou envoyer '+name;
          try{await SH.share({title:name,url:w.uri,dialogTitle:titreP})}
          catch(e1){
            if(annule(msg(e1)))return {annule:true};
            await SH.share({title:name,files:[w.uri],dialogTitle:titreP});
          }
          return repli!==null?{repli:true,erreur:repli,uri:w.uri}:{uri:w.uri};
        }catch(e){
          var m=msg(e);
          if(annule(m))return {annule:true};
          alert("Le fichier n\u2019a pas pu être enregistré ("+etape+") : "+m);
          return {annule:true};
        }
      },
      envoyerWhatsApp:async function(name,type,b64,texte){
        try{
          var FS=plug('Filesystem'),WA=plug('WaShare');
          if(!FS||!WA)return {indispo:true,erreur:'plugin introuvable'};
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          await WA.envoyer({path:w.uri,type:type,texte:texte||''});
          return {ok:true};
        }catch(e){return {indispo:true,erreur:msg(e)}}
      },
      ouvrir:async function(chemin){
        /* Ouvre le fichier enregistré (PDF) avec l'application Android de l'utilisateur */
        try{
          var FS=plug('Filesystem'),FO=plug('FileOpener'),SH=plug('Share'),uri=String(chemin||'');
          if(!uri)return false;
          if(!/^(file|content):/.test(uri)){
            try{var g=await FS.getUri({path:uri,directory:'DOCUMENTS'});uri=g.uri}catch(e){uri='file://'+uri}
          }
          var nom=decodeURI(uri.slice(uri.lastIndexOf('/')+1));
          var type=/\.pdf$/i.test(nom)?'application/pdf':(/\.xlsx$/i.test(nom)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/octet-stream');
          if(FO){try{await FO.open({filePath:uri,contentType:type,openWithDefault:true});return true}catch(e){}}
          if(SH){await SH.share({title:nom,url:uri,dialogTitle:'Ouvrir '+nom});return true}
        }catch(e){}
        return false;
      },
      partager:async function(uri,name){
        try{var SH=plug('Share');if(SH)await SH.share({title:name,url:uri,dialogTitle:'Envoyer '+name})}catch(e){}
      }
    };
  }
  init();
  document.addEventListener('DOMContentLoaded',init);
  window.addEventListener('load',init);
  setTimeout(init,500);setTimeout(init,1500);setTimeout(init,4000);
})();
</script>

function download(blob,name){
 /* APK (Capacitor) : écrit le fichier dans le cache puis ouvre le partage Android */
 try{const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){
  const pl=k=>{try{return (C.Plugins&&C.Plugins[k])||C.registerPlugin(k)}catch(e){return null}},FS=pl("Filesystem"),SH=pl("Share");
  if(FS&&SH){const r=new FileReader();r.onload=async()=>{try{const w=await FS.writeFile({path:name,data:String(r.result).split(",")[1],directory:"CACHE",recursive:true});await SH.share({title:name,url:w.uri,dialogTitle:"Enregistrer ou envoyer "+name})}catch(e){const m=String((e&&e.message)||e);if(!/cancel|dismiss/i.test(m))toast("Enregistrement impossible : "+m)}};r.readAsDataURL(blob);return}}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}

 fixZr(k,el,mode){const z=M.ui.rz;M.zr[z]=M.zr[z]||{};let v=el.value;if(mode==="up")v=UPS(v.trim());else if(mode==="pn")v=cap1(v);else if(mode==="tt")v=fmtTitre(v);el.value=M.zr[z][k]=v;save();const o=$("rzSel");if(o){[...o.options].forEach(op=>{op.text=(zrMissing(op.value).length?"⚠ ":"✓ ")+op.value})}},
 pickZep(z){if(!z)return;M.ui.rz=z;save();show("ident")},
 zepIn(el){setDup("zepDup",dupMsg(el.value,"ZEP"));const seen=new Set();M.zeps=el.value.split(/\r?\n/).map(x=>UPS(x.trim())).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true});save()},
 zepBlur(el){const dm=dupMsg(el.value,"ZEP"),raw=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length;sortAll();save();el.value=M.zeps.join("\n");setDup("zepDup",dm);const d=raw-M.zeps.length;$("zepInfo").textContent=M.zeps.length+" ZEP saisie"+(M.zeps.length>1?"s":"")+(d>0?" — "+d+" doublon"+(d>1?"s":"")+" ignoré"+(d>1?"s":""):"")+"."},
 ecIn(el){setDup("ecDup",dupMsg(el.value,"écoles"));const seen=new Set(),old=new Map(M.schools.map(s=>[nk(s.n),s]));M.schools=el.value.split(/\r?\n/).map(x=>UPS(x.trim().replace(/\s+/g," "))).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true}).map(n=>old.get(nk(n))||{id:mkId(n),n:n,st:"",zep:"",eb:false});save()},
 ecBlur(el){const dm=dupMsg(el.value,"écoles"),raw=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length,dup=raw-M.schools.length;sortAll();save();show("ident");setDup("ecDup",dm);const t=$("ecInfo");if(t&&dup>0)t.textContent=M.schools.length+" école(s) — "+dup+" doublon(s) ignoré(s)."},
 delSch(id){const s=M.schools.find(x=>x.id===id);if(!s)return;window.__delId=id;modal('<h3 style="margin-top:0;color:var(--rd)">Supprimer cette école ?</h3><p><b>'+esc(s.n)+'</b></p><p class="warn">L’école et tous ses résultats (Compositions et Examens blancs) seront supprimés définitivement.</p><div class="ctl rb2"><button class="bt red" onclick="LG.delSchOk()">Supprimer</button><button class="bt sec" onclick="LG.cancelDel()">Annuler</button></div>')},
 cancelDel(){window.__delId=null;closeModal()},
 delSchOk(){const id=window.__delId;window.__delId=null;closeModal();const s=M.schools.find(x=>x.id===id);if(!s)return;M.schools=M.schools.filter(x=>x.id!==id);save();
  const D=rd(K_LOCO);if(D){[["ef",0],["rs",1]].forEach(([k,ix])=>{const o=D[k]||{};Object.keys(o).forEach(key=>{if(key.split("|")[ix]===id)delete o[key]})});wr(K_LOCO,D)}
  const S=rd(K_EB);if(S){Object.keys(S.ex||{}).forEach(n=>{if(S.ex[n]&&S.ex[n].d)delete S.ex[n].d[s.n]});if(S.meta)delete S.meta[s.n];wr(K_EB,S)}
  toast("École supprimée : "+s.n);show("ident")},
 setEb(id,v){const s=M.schools.find(x=>x.id===id);if(s){s.eb=!!v;save();LG.ebInfo()}},
 ebAll(v){M.schools.forEach(s=>{s.eb=!!v});save();document.querySelectorAll(".ebck").forEach(c=>{c.checked=!!v});LG.ebInfo()},
 ebInfo(){const t=$("ebInfo");if(t){const n=M.schools.filter(s=>s.eb).length;t.textContent=n+" école(s) cochée(s) sur "+M.schools.length+"."}},
 setSch(id,k,v){const s=M.schools.find(x=>x.id===id);if(s){s[k]=v;save()}},
 dcg(g){M.ui.dcg=g;save();show("ident")},
 discIn(w,el){const l=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const vu=new Map();const res=[];const noms=[];let dbl=false;l.forEach(x=>{const k=nk(x);if(vu.has(k)){dbl=true;if(!noms.includes(vu.get(k)))noms.push(vu.get(k));return}vu.set(k,x);res.push(x)});if(w==="dc"){M.discC[M.ui.dcg||"CP"]=res}else M.discE=res;save();if(dbl){el.value=res.join("\n");discDupNotify(el,noms)}},
 discBlur(w,el){const seen=new Set(),l=el.value.split(/\r?\n/).map(x=>x.trim()).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true});if(w==="dc")M.discC[M.ui.dcg||"CP"]=l;else M.discE=l;save();el.value=l.join("\n")},
 copyDc(){const g=M.ui.dcg||"CP";["CP","CE","CM"].forEach(x=>{M.discC[x]=M.discC[x]===M.discC[g]?M.discC[x]:union(M.discC[x],M.discC[g])});save();toast("Disciplines copiées dans CP, CE et CM.")},
 backup(){download(new Blob([JSON.stringify(backupObj())],{type:"application/json"}),fileName());toast("Sauvegarde enregistrée : "+fileName())},
 async share(){const b=new Blob([JSON.stringify(backupObj())],{type:"application/json"});try{const f=new File([b],fileName(),{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Sauvegarde LoCoRES"});return}}catch(e){if(e&&e.name==="AbortError")return}download(b,fileName());toast("Le partage n’est pas disponible ici : le fichier a été téléchargé.")},
 pick(el){const f=el.files[0];el.value="";if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast("Fichier invalide : ce n’est pas une sauvegarde.")}LG.analyse(d,f.name)};r.readAsText(f)},
 analyse(d,name){
  const cnt=(a)=>Array.isArray(a)?a.length:0;
  if(d&&(d.format==="LoCoRES"||d.format==="LIGES"||d.format==="LoGES")&&d.master){window.__pend={t:"loges",d};modal('<h3 style="margin-top:0">Restaurer une sauvegarde LoCoRES</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.master.zeps)+" ZEP, "+cnt(d.master.schools)+' école(s).</p><p class="warn">Toutes les données actuelles (identification, ZEP, écoles, disciplines et résultats) seront remplacées.</p><div class="ctl"><button class="bt red" onclick="LG.apply()">Restaurer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  if(d&&Array.isArray(d.ec)&&d.di){window.__pend={t:"loco",d};modal('<h3 style="margin-top:0">Intégrer un fichier LoCoRéCo (Compositions)</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.zep)+" ZEP, "+cnt(d.ec)+' école(s).</p><p>L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont ajoutés à ceux déjà saisis (sans rien effacer). Les <b>résultats des Compositions</b> actuels sont remplacés par ceux du fichier.</p><div class="ctl"><button class="bt" onclick="LG.apply()">Intégrer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  if(d&&Array.isArray(d.schools)&&d.ex){window.__pend={t:"eb",d};modal('<h3 style="margin-top:0">Intégrer un fichier LoCoREB (Examens blancs)</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.zeps)+" ZEP, "+cnt(d.schools)+' école(s).</p><p>L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont ajoutés à ceux déjà saisis (sans rien effacer). Les <b>résultats des Examens blancs</b> actuels sont remplacés par ceux du fichier.</p><div class="ctl"><button class="bt" onclick="LG.apply()">Intégrer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  toast("Fichier non reconnu : ce n’est ni une sauvegarde LoCoRES, ni un fichier LoCoRéCo ou LoCoREB.")},
 cancel(){window.__pend=null;closeModal()},
 apply(){const p=window.__pend;window.__pend=null;closeModal();if(!p)return;
  try{
   if(p.t==="loges"){const d=p.d;M=fix(d.master);M.ui.page="home";save();if(d.loco)wr(K_LOCO,d.loco);else localStorage.removeItem(K_LOCO);if(d.locoreb)wr(K_EB,d.locoreb);else localStorage.removeItem(K_EB)}
   else if(p.t==="loco"){const D=importLoco(p.d);save();wr(K_LOCO,D)}
   else{const S=importEB(p.d);save();wr(K_EB,S)}
   toast("Restauration terminée.");show("home")
  }catch(e){toast("La restauration a échoué : "+(e&&e.message||e))}},
 resetAsk(){modal('<h3 style="margin-top:0;color:var(--rd)">Réinitialiser l’application</h3><label style="font-weight:400"><input type="radio" name="rl" value="res" checked style="display:inline;width:auto;margin:0 8px 0 0"><b>Effacer les résultats</b> des Compositions et des Examens blancs. L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont conservés.</label><label style="font-weight:400"><input type="radio" name="rl" value="all" style="display:inline;width:auto;margin:0 8px 0 0"><b>Tout effacer</b> : résultats, identification, ZEP, écoles, R/ZEP et disciplines.</label><p class="warn">Cette action est définitive. Pour confirmer, tapez <b>REINITIALISER</b> ci-dessous.</p><input id="rmi" autocomplete="off" spellcheck="false" oninput="LG.rchk()"><div class="ctl rb2"><button class="bt red" id="rgo" disabled onclick="LG.resetDo()">Réinitialiser</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>')},
 rchk(){const v=String($("rmi").value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase();$("rgo").disabled=v!=="REINITIALISER"},
 resetDo(){const all=(document.querySelector('input[name="rl"]:checked')||{}).value==="all";closeModal();
  try{
   const D=rd(K_LOCO);if(D){D.ef={};D.rs={};wr(K_LOCO,D)}
   const S=rd(K_EB);if(S){Object.keys(S.ex||{}).forEach(n=>{if(S.ex[n])S.ex[n].d={}});wr(K_EB,S)}
   if(all){M=emptyM();M.id.date=today();localStorage.removeItem(K_LOCO);localStorage.removeItem(K_EB);try{localStorage.removeItem("chz")}catch(e){}}
   M.ui.page="home";M.ui.warn=null;save();toast(all?"Application entièrement réinitialisée.":"Résultats effacés.");show("home")
  }catch(e){toast("La réinitialisation a échoué.")}}
};
LG.copyId=copyId;LG.renew=doRenew;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.loges==="goto"){M.ui.sub=d.sub||M.ui.sub;if(d.zep&&M.zeps.includes(d.zep))M.ui.rz=d.zep;M.ui.warn=null;save();show(d.page||"ident")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ovl").classList.contains("on"))closeModal()});
show(cur);
})();
</script>
</body>
</html>
