<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c3e">
<title>LoCoRES — Logiciel de Compilation des Résultats des Évaluations Scolaires</title>
<style>
:root{--bg:#f5f6f2;--sf:#fff;--tx:#1b231e;--mu:#59655d;--ac:#1d5c3e;--ac2:#2f7d57;--ln:#c9d1ca;--hd:#e2ebe4;--rd:#c1121f;--gn:#15803d;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:17px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#top{display:none;background:var(--ac);color:#fff;position:sticky;top:0;z-index:20;align-items:center;gap:8px;padding:6px 10px;flex-wrap:nowrap;height:48px}
#top.on{display:flex}
#top .brand{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto}
#top .brand .logo{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#1b5e20}
#top .brand .logo svg{display:block}
#top .brand .brand-txt{color:#1b5e20;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;line-height:1}
#top{display:flex;align-items:center;gap:24px}
#top .brand{flex:0 0 auto}
#top nav{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;justify-content:flex-start;align-items:center;flex:1 1 auto;text-align:center;min-width:0;max-width:100%}
#top nav button{margin:0;flex:0 0 auto}
#top nav button{text-transform:uppercase;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-width:170px;text-align:center}
#top nav button.on{background:#fff;color:var(--ac)}
#view{max-width:1000px;margin:0 auto;padding:12px}
#view.mod{max-width:none;padding:0}
#modwrap{display:none}
#modwrap.on{display:block}
#modwrap iframe{display:block;width:100%;border:0;background:#fff;height:calc(100vh - 48px - env(safe-area-inset-top,0px));height:calc(100dvh - 48px - env(safe-area-inset-top,0px))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 12px}
h2{margin:0 0 10px;color:var(--ac);font-size:21px;text-align:center}
h3{margin:0 0 8px;font-size:17px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px;font:inherit;font-weight:400;border:1px solid #8a9a8f;border-radius:6px;background:#fff;color:var(--tx)}
textarea{min-height:220px;resize:vertical}
input.bad,select.bad{border-color:var(--rd);background:#fff5f5}
.rq{color:var(--rd);font-weight:700}
.row{display:grid;gap:10px}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}.r3{grid-template-columns:repeat(3,minmax(0,1fr))}.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:700px){.r2,.r3,.r4{grid-template-columns:1fr}}
.bt{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.bt:hover{background:var(--ac2)}
.bt.sec{background:#fff;color:var(--ac);border:2px solid var(--ac)}
.bt.red{background:var(--rd)}
.bt.nv{text-transform:uppercase}.bt.sm{padding:5px 10px;font-size:13px}.etab th:nth-child(1),.etab td:nth-child(1){width:46px}.etab td:nth-child(2){white-space:nowrap;min-width:240px}.etab td:nth-child(3),.etab th:nth-child(3){width:112px;min-width:104px}.etab td:nth-child(4),.etab th:nth-child(4){width:22%;min-width:165px}.etab td select{width:100%}
.etab td:nth-child(5),.etab th:nth-child(5){width:66px;min-width:60px;text-align:center}.etab td input[type=checkbox]{display:inline-block;width:22px;height:22px;margin:0;padding:0;cursor:pointer;accent-color:var(--ac)}.zrg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 78px;gap:10px;margin-top:6px}.zrg label{margin:0}.zrg .zl{grid-column:1}.zrsel{width:150px;min-width:0;max-width:100%}@media(max-width:700px){.zrg{grid-template-columns:minmax(0,1fr);gap:8px}.zrg .zl{grid-column:1}.zrg select{font-size:16px;padding:9px 6px;max-width:110px}.zrsel{width:100%;max-width:none}.etab,.etab tbody{display:block;width:100%}.etab tr:first-child{display:none}.etab tr{display:grid;grid-template-columns:24px 66px minmax(0,1fr) auto;gap:6px 8px;align-items:center;border:2.5px solid var(--ac);border-radius:8px;padding:8px;margin:0 0 10px}.etab td{display:block;border:0;padding:0}.etab td:nth-child(n){width:auto!important;min-width:0!important;white-space:normal!important;text-align:left}.etab td:nth-child(1){grid-column:1;font-size:17px;font-weight:700;color:var(--tx)}.etab td:nth-child(1)::after{content:'.'}.etab td:nth-child(2){grid-column:2/-1;font-weight:700;font-size:17px}.etab td:nth-child(3){grid-column:1/3}.etab td:nth-child(4){grid-column:3/-1}.etab td:nth-child(3)::before{content:'Statut';display:block;font-size:12px;font-weight:700}.etab td:nth-child(4)::before{content:'ZEP';display:block;font-size:12px;font-weight:700}.etab td:nth-child(5){grid-column:1/3}.etab td:nth-child(5)::before{content:'CM2';font-size:12px;font-weight:700;margin-right:8px;vertical-align:middle}.etab td:nth-child(6){grid-column:3/-1;text-align:right}}
.ctl.eq .bt{width:260px;max-width:100%;box-sizing:border-box;text-align:center}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mu{color:var(--mu);font-size:14px}
.warn{position:relative;color:#b00020;border:2px solid #c00000;background:#fff5f5;border-radius:6px;padding:10px;margin:0 0 12px;white-space:pre-line}
.warn .wx{float:right;margin:-4px -4px 0 8px;background:#c00000;color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:18px;line-height:1;font-weight:700;cursor:pointer}
.warn span{white-space:pre-line}
.okm{color:#206329;border:2px solid #2e7d32;background:#f2fff4;border-radius:6px;padding:10px;margin:0 0 12px;white-space:pre-line}
.subtabs{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:440px;margin:26px auto 0}
.subtabs button{text-transform:uppercase;display:block;width:100%;box-sizing:border-box;text-align:center;margin:0 auto;background:#fff;color:var(--ac);border:2px solid var(--ac);border-radius:6px;padding:9px 11px;font-size:14px;font-weight:700;cursor:pointer}
.subtabs button.on{background:var(--ac);color:#fff}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--ln);padding:5px 7px;text-align:left}
th{background:var(--hd)}
td select{margin:0;padding:6px}
.w{overflow-x:auto}
/* accueil */
.home{text-align:center;padding:26px 12px 40px}
.home h1{margin:0 0 6px;font-size:clamp(24px,5.5vw,40px);color:var(--ac);line-height:1.25}
.home .wl{display:inline-block;white-space:nowrap}
.home .ch{display:inline-block;opacity:0;animation:pop .6s cubic-bezier(.2,.8,.3,1.4) forwards,glow 4.2s ease-in-out infinite backwards;animation-delay:calc(var(--i)*45ms),calc(var(--i)*45ms + 1.4s)}
.home .sub{display:block;margin-top:8px;font-size:clamp(16px,3.4vw,22px);color:var(--tx);font-weight:400;opacity:0;animation:fade 1s ease forwards;animation-delay:calc(var(--n)*45ms + .3s)}
@keyframes pop{0%{opacity:0;transform:translateY(-28px) scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes glow{0%,100%{color:#e30613}33%{color:#f7c600}66%{color:#1b9e3a}}
@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){.home .ch,.home .sub{animation:none;opacity:1}}
.menu{display:flex;flex-direction:column;gap:10px;max-width:440px;margin:26px auto 0}
.menu button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:15px 18px;font:inherit;font-size:18px;font-weight:700;letter-spacing:.4px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.menu button:hover{background:var(--ac2)}
.menu button.d{background:var(--rd)}
.credit{display:inline-block;margin-top:26px;padding:10px 26px;border:2px solid var(--ac);border-radius:8px;background:var(--sf);font-size:14px;color:var(--mu);line-height:1.55;text-align:center}.credit .ct{font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.5px}.credit .nm{font-weight:700;color:var(--tx)}
.credit b{color:var(--tx)}
/* fenêtres */
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#ovl.on{display:flex}
#ovl .box{background:#fff;border-radius:10px;max-width:560px;width:100%;padding:18px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
.ctl.bk2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}.ctl.bk2>.bt{width:100%;min-width:0;margin:0;white-space:normal;overflow-wrap:anywhere;text-align:center}@media(max-width:560px){.ctl.bk2{grid-template-columns:1fr}}#obox .ctl>button[onclick="LG.cancel()"]{margin-left:auto}#obox .ctl.rb2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}#obox .ctl.rb2>.bt{width:100%;min-width:0;margin:0!important;text-align:center}.lid{letter-spacing:2px;font-size:1.15em;user-select:all}.lock{max-width:520px;margin:30px auto;text-align:center}.lock textarea{text-align:left;font-family:monospace}.lock .ctl{justify-content:center}
</style>
<style id="lg-bold">input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]):not([type=range]):not([type=color]),select,textarea{font-weight:700}input::placeholder,textarea::placeholder{font-weight:400}select option{font-weight:400}
</style>
</head>

<div id="top"></div>
<div id="view"></div>
<div id="modwrap"></div>
<div id="ovl"><div class="box" id="obox"></div></div>
<div id="toast"></div>

function download(blob,name){
 /* APK (Capacitor) : écrit le fichier dans le cache puis ouvre le partage Android */
 try{const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()){
  const pl=k=>{try{return (C.Plugins&&C.Plugins[k])||C.registerPlugin(k)}catch(e){return null}},FS=pl("Filesystem"),SH=pl("Share");
  if(FS&&SH){const r=new FileReader();r.onload=async()=>{try{const w=await FS.writeFile({path:name,data:String(r.result).split(",")[1],directory:"CACHE",recursive:true});await SH.share({title:name,url:w.uri,dialogTitle:"Enregistrer ou envoyer "+name})}catch(e){const m=String((e&&e.message)||e);if(!/cancel|dismiss/i.test(m))toast("Enregistrement impossible : "+m)}};r.readAsDataURL(blob);return}}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}

 pickZep(z){if(!z)return;M.ui.rz=z;save();show("ident")},
 zepIn(el){setDup("zepDup",dupMsg(el.value,"ZEP"));const seen=new Set();M.zeps=el.value.split(/\r?\n/).map(x=>UPS(x.trim())).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true});save()},
 zepBlur(el){const dm=dupMsg(el.value,"ZEP"),raw=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length;sortAll();save();el.value=M.zeps.join("\n");setDup("zepDup",dm);const d=raw-M.zeps.length;$("zepInfo").textContent=M.zeps.length+" ZEP saisie"+(M.zeps.length>1?"s":"")+(d>0?" — "+d+" doublon"+(d>1?"s":"")+" ignoré"+(d>1?"s":""):"")+"."},
 ecIn(el){setDup("ecDup",dupMsg(el.value,"écoles"));const seen=new Set(),old=new Map(M.schools.map(s=>[nk(s.n),s]));M.schools=el.value.split(/\r?\n/).map(x=>UPS(x.trim().replace(/\s+/g," "))).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true}).map(n=>old.get(nk(n))||{id:mkId(n),n:n,st:"",zep:"",eb:false});save()},
 ecBlur(el){const dm=dupMsg(el.value,"écoles"),raw=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length,dup=raw-M.schools.length;sortAll();save();show("ident");setDup("ecDup",dm);const t=$("ecInfo");if(t&&dup>0)t.textContent=M.schools.length+" école(s) — "+dup+" doublon(s) ignoré(s)."},
 delSch(id){const s=M.schools.find(x=>x.id===id);if(!s)return;window.__delId=id;modal('<h3 style="margin-top:0;color:var(--rd)">Supprimer cette école ?</h3><p><b>'+esc(s.n)+'</b></p><p class="warn">L’école et tous ses résultats (Compositions et Examens blancs) seront supprimés définitivement.</p><div class="ctl rb2"><button class="bt red" onclick="LG.delSchOk()">Supprimer</button><button class="bt sec" onclick="LG.cancelDel()">Annuler</button></div>')},
 cancelDel(){window.__delId=null;closeModal()},
 delSchOk(){const id=window.__delId;window.__delId=null;closeModal();const s=M.schools.find(x=>x.id===id);if(!s)return;M.schools=M.schools.filter(x=>x.id!==id);save();
  const D=rd(K_LOCO);if(D){[["ef",0],["rs",1]].forEach(([k,ix])=>{const o=D[k]||{};Object.keys(o).forEach(key=>{if(key.split("|")[ix]===id)delete o[key]})});wr(K_LOCO,D)}
  const S=rd(K_EB);if(S){Object.keys(S.ex||{}).forEach(n=>{if(S.ex[n]&&S.ex[n].d)delete S.ex[n].d[s.n]});if(S.meta)delete S.meta[s.n];wr(K_EB,S)}
  toast("École supprimée : "+s.n);show("ident")},
 setEb(id,v){const s=M.schools.find(x=>x.id===id);if(s){s.eb=!!v;save();LG.ebInfo()}},
 ebAll(v){M.schools.forEach(s=>{s.eb=!!v});save();document.querySelectorAll(".ebck").forEach(c=>{c.checked=!!v});LG.ebInfo()},
 ebInfo(){const t=$("ebInfo");if(t){const n=M.schools.filter(s=>s.eb).length;t.textContent=n+" école(s) cochée(s) sur "+M.schools.length+"."}},
 setSch(id,k,v){const s=M.schools.find(x=>x.id===id);if(s){s[k]=v;save()}},
 dcg(g){M.ui.dcg=g;save();show("ident")},
 discIn(w,el){const l=el.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const vu=new Map();const res=[];const noms=[];let dbl=false;l.forEach(x=>{const k=nk(x);if(vu.has(k)){dbl=true;if(!noms.includes(vu.get(k)))noms.push(vu.get(k));return}vu.set(k,x);res.push(x)});if(w==="dc"){M.discC[M.ui.dcg||"CP"]=res}else M.discE=res;save();if(dbl){el.value=res.join("\n");discDupNotify(el,noms)}},
 discBlur(w,el){const seen=new Set(),l=el.value.split(/\r?\n/).map(x=>x.trim()).filter(x=>{const k=nk(x);if(!x||seen.has(k))return false;seen.add(k);return true});if(w==="dc")M.discC[M.ui.dcg||"CP"]=l;else M.discE=l;save();el.value=l.join("\n")},
 copyDc(){const g=M.ui.dcg||"CP";["CP","CE","CM"].forEach(x=>{M.discC[x]=M.discC[x]===M.discC[g]?M.discC[x]:union(M.discC[x],M.discC[g])});save();toast("Disciplines copiées dans CP, CE et CM.")},
 backup(){download(new Blob([JSON.stringify(backupObj())],{type:"application/json"}),fileName());toast("Sauvegarde enregistrée : "+fileName())},
 async share(){const b=new Blob([JSON.stringify(backupObj())],{type:"application/json"});try{const f=new File([b],fileName(),{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Sauvegarde LoCoRES"});return}}catch(e){if(e&&e.name==="AbortError")return}download(b,fileName());toast("Le partage n’est pas disponible ici : le fichier a été téléchargé.")},
 pick(el){const f=el.files[0];el.value="";if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast("Fichier invalide : ce n’est pas une sauvegarde.")}LG.analyse(d,f.name)};r.readAsText(f)},
 analyse(d,name){
  const cnt=(a)=>Array.isArray(a)?a.length:0;
  if(d&&(d.format==="LoCoRES"||d.format==="LIGES"||d.format==="LoGES")&&d.master){window.__pend={t:"loges",d};modal('<h3 style="margin-top:0">Restaurer une sauvegarde LoCoRES</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.master.zeps)+" ZEP, "+cnt(d.master.schools)+' école(s).</p><p class="warn">Toutes les données actuelles (identification, ZEP, écoles, disciplines et résultats) seront remplacées.</p><div class="ctl"><button class="bt red" onclick="LG.apply()">Restaurer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  if(d&&Array.isArray(d.ec)&&d.di){window.__pend={t:"loco",d};modal('<h3 style="margin-top:0">Intégrer un fichier LoCoRéCo (Compositions)</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.zep)+" ZEP, "+cnt(d.ec)+' école(s).</p><p>L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont ajoutés à ceux déjà saisis (sans rien effacer). Les <b>résultats des Compositions</b> actuels sont remplacés par ceux du fichier.</p><div class="ctl"><button class="bt" onclick="LG.apply()">Intégrer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  if(d&&Array.isArray(d.schools)&&d.ex){window.__pend={t:"eb",d};modal('<h3 style="margin-top:0">Intégrer un fichier LoCoREB (Examens blancs)</h3><p>Fichier : <b>'+esc(name)+'</b><br>'+cnt(d.zeps)+" ZEP, "+cnt(d.schools)+' école(s).</p><p>L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont ajoutés à ceux déjà saisis (sans rien effacer). Les <b>résultats des Examens blancs</b> actuels sont remplacés par ceux du fichier.</p><div class="ctl"><button class="bt" onclick="LG.apply()">Intégrer</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>');return}
  toast("Fichier non reconnu : ce n’est ni une sauvegarde LoCoRES, ni un fichier LoCoRéCo ou LoCoREB.")},
 cancel(){window.__pend=null;closeModal()},
 apply(){const p=window.__pend;window.__pend=null;closeModal();if(!p)return;
  try{
   if(p.t==="loges"){const d=p.d;M=fix(d.master);M.ui.page="home";save();if(d.loco)wr(K_LOCO,d.loco);else localStorage.removeItem(K_LOCO);if(d.locoreb)wr(K_EB,d.locoreb);else localStorage.removeItem(K_EB)}
   else if(p.t==="loco"){const D=importLoco(p.d);save();wr(K_LOCO,D)}
   else{const S=importEB(p.d);save();wr(K_EB,S)}
   toast("Restauration terminée.");show("home")
  }catch(e){toast("La restauration a échoué : "+(e&&e.message||e))}},
 resetAsk(){modal('<h3 style="margin-top:0;color:var(--rd)">Réinitialiser l’application</h3><label style="font-weight:400"><input type="radio" name="rl" value="res" checked style="display:inline;width:auto;margin:0 8px 0 0"><b>Effacer les résultats</b> des Compositions et des Examens blancs. L’identification, les ZEP, les écoles, les R/ZEP et les disciplines sont conservés.</label><label style="font-weight:400"><input type="radio" name="rl" value="all" style="display:inline;width:auto;margin:0 8px 0 0"><b>Tout effacer</b> : résultats, identification, ZEP, écoles, R/ZEP et disciplines.</label><p class="warn">Cette action est définitive. Pour confirmer, tapez <b>REINITIALISER</b> ci-dessous.</p><input id="rmi" autocomplete="off" spellcheck="false" oninput="LG.rchk()"><div class="ctl rb2"><button class="bt red" id="rgo" disabled onclick="LG.resetDo()">Réinitialiser</button><button class="bt sec" onclick="LG.cancel()">Annuler</button></div>')},
 rchk(){const v=String($("rmi").value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase();$("rgo").disabled=v!=="REINITIALISER"},
 resetDo(){const all=(document.querySelector('input[name="rl"]:checked')||{}).value==="all";closeModal();
  try{
   const D=rd(K_LOCO);if(D){D.ef={};D.rs={};wr(K_LOCO,D)}
   const S=rd(K_EB);if(S){Object.keys(S.ex||{}).forEach(n=>{if(S.ex[n])S.ex[n].d={}});wr(K_EB,S)}
   if(all){M=emptyM();M.id.date=today();localStorage.removeItem(K_LOCO);localStorage.removeItem(K_EB);try{localStorage.removeItem("chz")}catch(e){}}
   M.ui.page="home";M.ui.warn=null;save();toast(all?"Application entièrement réinitialisée.":"Résultats effacés.");show("home")
  }catch(e){toast("La réinitialisation a échoué.")}}
};
LG.copyId=copyId;LG.renew=doRenew;
window.addEventListener("message",e=>{const d=e.data;if(d&&d.loges==="goto"){M.ui.sub=d.sub||M.ui.sub;if(d.zep&&M.zeps.includes(d.zep))M.ui.rz=d.zep;M.ui.warn=null;save();show(d.page||"ident")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ovl").classList.contains("on"))closeModal()});
show(cur);
})();
</script>
</body>
</html>
