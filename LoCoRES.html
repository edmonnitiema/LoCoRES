<!DOCTYPE html>
<html lang="fr">
<head>
<script>
/* LoCoRES - Pont d'enregistrement (APK Capacitor), défini ici une seule fois pour toute l'application.
   Les modules Compositions et Examens blancs (iframes) le reprennent via window.parent.Pont. */
(function(){
  if(window.Pont)return;
  function cap(){return window.Capacitor||null}
  function plug(n){
    var c=cap();if(!c)return null;
    try{if(c.Plugins&&c.Plugins[n])return c.Plugins[n]}catch(e){}
    try{if(typeof c.registerPlugin==='function')return c.registerPlugin(n)}catch(e){}
    return null;
  }
  function isNative(){
    var c=cap();if(!c)return false;
    try{if(typeof c.isNativePlatform==='function'&&c.isNativePlatform())return true}catch(e){}
    try{if(typeof c.getPlatform==='function'&&c.getPlatform()!=='web')return true}catch(e){}
    return !!window.androidBridge||/; wv\)/.test(navigator.userAgent||'');
  }
  function msg(e){return String((e&&e.message)||e)}
  function annule(m){return /cancel|dismiss|abort/i.test(m)}
  function delai(p,ms,nom){
    return new Promise(function(ok,ko){
      var t=setTimeout(function(){ko(new Error(nom+' : délai dépassé'))},ms);
      p.then(function(v){clearTimeout(t);ok(v)},function(e){clearTimeout(t);ko(e)});
    });
  }
  function init(){
    if(window.Pont||!isNative())return;
    window.Pont={
      enregistrer:async function(name,type,b64,dossier,titre){
        var FS=plug('Filesystem'),SH=plug('Share'),repli=null,etape='';
        try{
          if(!FS)throw new Error('plugin Filesystem introuvable dans l\u2019APK');
          if(dossier){
            /* 1) Dossier dans « Documents » (peut être refusé selon la version d'Android) */
            try{
              etape='permissions';
              try{var pm=await FS.checkPermissions();if(pm&&pm.publicStorage&&pm.publicStorage!=='granted')await FS.requestPermissions()}catch(e){}
              var rel=dossier+'/'+name;
              etape='écriture dans Documents';
              await delai(FS.writeFile({path:rel,data:b64,directory:'DOCUMENTS',recursive:true}),20000,'écriture dans Documents');
              etape='lecture du chemin';
              var g=await FS.getUri({path:rel,directory:'DOCUMENTS'});
              var ch=decodeURI(String(g.uri).replace(/^file:\/\//,''));
              return {chemin:ch,dossier:dossier,dossierChemin:ch.slice(0,ch.lastIndexOf('/')),uri:g.uri};
            }catch(e){repli=etape+' : '+msg(e)}
            /* 1b) À défaut du dossier Documents : enregistrement automatique dans « Téléchargements » */
            try{
              etape='écriture dans Téléchargements';
              var relD='Download/'+name;
              await delai(FS.writeFile({path:relD,data:b64,directory:'EXTERNAL_STORAGE',recursive:true}),20000,'écriture dans Téléchargements');
              var gd=await FS.getUri({path:relD,directory:'EXTERNAL_STORAGE'});
              var chd=decodeURI(String(gd.uri).replace(/^file:\/\//,''));
              return {chemin:chd,dossier:'Téléchargements',dossierChemin:chd.slice(0,chd.lastIndexOf('/')),uri:gd.uri,telechargement:true};
            }catch(e){repli=(repli?repli+' | ':'')+etape+' : '+msg(e)}
          }
          /* 2) Repli fiable : fichier temporaire + feuille de partage Android */
          if(!SH)throw new Error('plugin Share introuvable dans l\u2019APK');
          etape='écriture temporaire';
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          etape='partage';
          var titreP=titre||'Enregistrer ou envoyer '+name;
          try{await SH.share({title:name,url:w.uri,dialogTitle:titreP})}
          catch(e1){
            if(annule(msg(e1)))return {annule:true};
            await SH.share({title:name,files:[w.uri],dialogTitle:titreP});
          }
          window.__dernierRepli=repli;return repli!==null?{repli:true,erreur:repli,uri:w.uri}:{uri:w.uri};
        }catch(e){
          var m=msg(e);
          if(annule(m))return {annule:true};
          alert("Le fichier n\u2019a pas pu être enregistré ("+etape+") : "+m);
          return {annule:true};
        }
      },
      envoyerWhatsApp:async function(name,type,b64,texte){
        try{
          var FS=plug('Filesystem'),WA=plug('WaShare');
          if(!FS||!WA)return {indispo:true,erreur:'plugin introuvable'};
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          await WA.envoyer({path:w.uri,type:type,texte:texte||''});
          return {ok:true};
        }catch(e){return {indispo:true,erreur:msg(e)}}
      },
      ouvrir:async function(chemin,b64,nom){
        /* Ouvre le fichier (PDF) : copie temporaire dans le cache puis ouverture/partage Android */
        try{
          var FS=plug('Filesystem'),FO=plug('FileOpener'),SH=plug('Share'),ch=String(chemin||'');
          nom=nom||decodeURI(ch.slice(ch.lastIndexOf('/')+1))||'document.pdf';
          var type=/\.pdf$/i.test(nom)?'application/pdf':'application/octet-stream';
          if(!FS)return false;
          if(!b64&&ch){
            var p=ch.replace(/^file:\/\//,'');
            var rd=await FS.readFile({path:/^file:/.test(ch)?ch:'file://'+p});
            b64=rd&&rd.data;
          }
          if(!b64)return false;
          var w=await FS.writeFile({path:'ouvrir/'+nom,data:b64,directory:'CACHE',recursive:true});
          if(FO){try{await FO.open({filePath:w.uri,contentType:type,openWithDefault:true});return true}catch(e){}}
          if(SH){await SH.share({title:nom,url:w.uri,dialogTitle:'Ouvrir '+nom});return true}
        }catch(e){try{alert('Le PDF n\u2019a pas pu être ouvert : '+String((e&&e.message)||e))}catch(x){}}
        return false;
      },
      partager:async function(uri,name){
        try{var SH=plug('Share');if(SH)await SH.share({title:name,url:uri,dialogTitle:'Envoyer '+name})}catch(e){}
      }
    };
  }
  init();
  document.addEventListener('DOMContentLoaded',init);
  window.addEventListener('load',init);
  setTimeout(init,500);setTimeout(init,1500);setTimeout(init,4000);
})();
</script>

const h53=(s,seed)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};

const fAv=v=>v!==undefined&&v!==null&&String(v).trim()!=="";
const fLeaves=v=>{if(v&&typeof v==="object")return Object.keys(v).reduce((a,k)=>a+fLeaves(v[k]),0);return fAv(v)?1:0};
const fClone=v=>JSON.parse(JSON.stringify(v));
function fMerge(t,f,canon,rep,path){
 Object.keys(f||{}).forEach(k=>{
  const fv=f[k];if(fv===undefined||fv===null)return;
  let tk=k;if(canon){const n0=nk(k),ex=Object.keys(t).find(x=>nk(x)===n0);if(ex!==undefined)tk=ex}
  const tv=t[tk],isO=x=>x&&typeof x==="object"&&!Array.isArray(x);
  if(isO(fv)){
   if(isO(tv))fMerge(tv,fv,canon,rep,path+" › "+k);
   else if(tv===undefined||tv===null||tv===""||(Array.isArray(tv)&&!tv.length)){t[tk]=fClone(fv);rep.filled+=fLeaves(fv)}
   else{rep.conf++;if(rep.confs.length<40)rep.confs.push(path+" › "+k);if(rep.mode==="fichier")t[tk]=fClone(fv)}
  }else if(Array.isArray(fv)){
   if(!fv.length)return;
   if(tv===undefined||tv===null||tv===""||(Array.isArray(tv)&&!tv.length)){t[tk]=fClone(fv);rep.filled++}
   else if(JSON.stringify(tv)!==JSON.stringify(fv)){rep.conf++;if(rep.confs.length<40)rep.confs.push(path+" › "+k);if(rep.mode==="fichier")t[tk]=fClone(fv)}
  }else{
   if(!fAv(tv)){t[tk]=fv;if(fAv(fv))rep.filled++}
   else if(fAv(fv)&&String(tv)!==String(fv)){rep.conf++;if(rep.confs.length<40)rep.confs.push(path+" › "+k);if(rep.mode==="fichier")t[tk]=fv}
  }})}

 (f.schools||[]).forEach(e=>{if(!e||!e.n)return;let s=schoolByName(e.n);if(!s){s={id:e.id||mkId(e.n),n:UPS(String(e.n).trim()),st:"",zep:"",eb:false};M.schools.push(s)}
  if(!s.st&&e.st)s.st=e.st;if(!s.zep&&e.zep)s.zep=addZep(e.zep);if(e.eb)s.eb=true});
 Object.keys(f.zr||{}).forEach(z=>{const zz=addZep(z);M.zr[zz]=M.zr[zz]||{};fill(M.zr[zz],f.zr[z]||{})});
 ["CP","CE","CM"].forEach(g=>{M.discC[g]=union(M.discC[g],(f.discC||{})[g])});
 M.discE=union(M.discE,f.discE)}

 const mE=d=>{importEB(d);Object.keys(d.ex||{}).forEach(n=>{const o=d.ex[n];if(o&&o.d){const nd={};Object.keys(o.d).forEach(sn=>{const sc=schoolByName(sn);nd[sc?sc.n:sn]=o.d[sn]});o.d=nd}});fMerge(E.ex,d.ex||{},true,rep,"Examens blancs")};

   else if(f.kind==="loco")mL(d);else mE(d)});
  sortAll();rep.ecoles=M.schools.length-n0;rep.zeps=M.zeps.length-z0;

 }finally{if(!commit)M=fix(JSON.parse(snap))}
 return rep}

   +(nul?'<p class="mu">Rien de nouveau : ces fichiers ne contiennent pas de données absentes de votre application.</p>':'')
   +(rep.conf?'<p><b>Si une même case a des valeurs différentes :</b></p><label style="display:block;font-weight:400"><input type="radio" name="fmode" value="garder" checked style="display:inline;width:auto;margin:0 8px 0 0">Garder mes valeurs (celles déjà saisies)</label><label style="display:block;font-weight:400"><input type="radio" name="fmode" value="fichier" style="display:inline;width:auto;margin:0 8px 0 0">Prendre les valeurs des fichiers</label><ul class="mu">'+ex+'</ul>':'')
   +'<p class="mu">Les cases vides sont complétées avec les données des fichiers. Une sauvegarde de vos données actuelles est conservée : vous pourrez annuler la fusion depuis cette page.</p><div class="ctl"><button class="bt" '+(nul?'disabled ':'')+'onclick="LG.fusApply()">Appliquer la fusion</button><button class="bt sec" onclick="LG.fusCancel()">Annuler</button></div>')},
 fusCancel(){FUS.files=null;closeModal()},
 fusApply(){
  if(!FUS.ok||!FUS.files)return;
  const m=document.querySelector('input[name="fmode"]:checked'),mode=m?m.value:"garder",files=FUS.files;
  try{localStorage.setItem(FUS_UNDO,JSON.stringify(backupObj()))}catch(e){if(!confirm("Impossible de conserver une sauvegarde avant fusion (espace insuffisant). Continuer quand même ?"))return}
  try{const rep=fusRun(files,mode,true);FUS.files=null;closeModal();show("fusion");toast("Fusion appliquée : "+rep.filled+" case(s) complétée(s), "+rep.ecoles+" école(s) et "+rep.zeps+" ZEP ajoutée(s).")}
  catch(e){toast("La fusion a échoué : "+(e&&e.message||e))}},
 fusUndoAsk(){if(!FUS.ok)return;modal('<h3 style="margin-top:0">Annuler la dernière fusion</h3><p class="warn">Les données reviendront à l’état d’avant la dernière fusion. Les saisies faites depuis seront perdues.</p><div class="ctl"><button class="bt red" onclick="LG.fusUndo()">Annuler la fusion</button><button class="bt sec" onclick="LG.cancel()">Fermer</button></div>')},
 fusUndo(){
  closeModal();
  try{const d=JSON.parse(localStorage.getItem(FUS_UNDO)||"null");if(!d||!d.master)throw new Error("aucune sauvegarde");
   M=fix(d.master);M.ui.page="home";save();if(d.loco)wr(K_LOCO,d.loco);else localStorage.removeItem(K_LOCO);if(d.locoreb)wr(K_EB,d.locoreb);else localStorage.removeItem(K_EB);
   localStorage.removeItem(FUS_UNDO);toast("Fusion annulée.");show("fusion")}
  catch(e){toast("L’annulation a échoué : "+(e&&e.message||e))}}
});

window.addEventListener("message",e=>{const d=e.data;if(d&&d.loges==="goto"){M.ui.sub=d.sub||M.ui.sub;if(d.zep&&M.zeps.includes(d.zep))M.ui.rz=d.zep;M.ui.warn=null;save();show(d.page||"ident")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ovl").classList.contains("on"))closeModal()});
show(cur);
})();
</script>
</body>
</html>
