name: Construire LoCoRES

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les dossiers
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône de l'application (facultatif)
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1d5c3e' \
            --iconBackgroundColorDark '#1d5c3e'

      - name: Synchroniser l'application
        run: npx cap sync android

      - name: Utiliser la clé de signature fixe
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Numéro de version
        run: |
          F=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $F

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoCoRES.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LoCoRES-Android-APK
          path: LoCoRES.apk
          retention-days: 90

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Construire les programmes Windows
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: LoCoRES-Windows
          path: |
            dist/*.exe
          retention-days: 90
